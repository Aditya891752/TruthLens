services:
  - type: web
    name: truthlens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://truthlens.vercel.app,http://localhost:5173
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
      - key: GEMINI_API_KEY
        sync: false
